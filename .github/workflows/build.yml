name: Build Android + iOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        name: 读取版本号
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: 生成签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore
            echo "已还原签名文件"
          else
            # 未配置 secret 时现场生成一份（仅用于 CI 出包，与本地签名不同）
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "已生成临时签名文件"
          fi

      - name: 依赖
        run: flutter pub get

      - name: 分析
        run: flutter analyze

      - name: 测试
        run: flutter test

      - name: 构建 APK
        run: flutter build apk --release --split-per-abi

      - name: 收集产物
        run: |
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .apk)
            cp "$f" "dist/notes-app-${{ needs.meta.outputs.version }}-${base}.apk"
          done
          sha256sum dist/*.apk > dist/SHA256SUMS-android.txt || true
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.meta.outputs.version }}
          path: dist/*

  ios:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      # 每次先清掉 Pods 与 DerivedData 再重新 pod install，
      # 避免 Podfile.lock 与 sandbox 状态不同步（The sandbox is not in sync 报错）。
      - name: 同步 CocoaPods
        run: |
          rm -rf ios/Pods ios/Podfile.lock
          (cd ios && pod install --repo-update)

      # 用户使用巨魔（TrollStore）侧载，无需 Apple 签名证书，直接 no-codesign 出包
      - name: 构建 iOS（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包为 ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry "notes-app-${{ needs.meta.outputs.version }}-ios-unsigned.ipa" Payload
          rm -rf Payload
          sha256sum *.ipa > SHA256SUMS-ios.txt || true
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.meta.outputs.version }}
          path: dist/*

  release:
    needs: [meta, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.apk" -o -name "*.ipa" -o -name "SHA256SUMS*" \) -exec cp {} dist/ \;
          ls -lh dist/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## 安装说明

            - **Android**：下载对应 ABI 的 `*-release.apk` 直接安装。
            - **iOS**：下载 `*-ios-unsigned.ipa`，用**巨魔（TrollStore）**直接安装（无需签名）。
              非越狱设备需自签（AltStore / Sideloadly 等）。

            ## 首次使用

            打开 App 后在引导页填三项：内网地址、公网地址、内网 WiFi 名称（可点「读取当前」自动填）。
            连上指定 WiFi 时优先走内网地址，否则走公网域名。
